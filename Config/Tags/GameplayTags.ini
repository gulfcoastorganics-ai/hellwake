; Designer-facing mirror of Source/Hellwake/HellwakeGameplayTags.h/.cpp —
; those native UE_DEFINE_GAMEPLAYTAG declarations are the actual source of
; truth and register themselves automatically; nothing here needs to match
; byte-for-byte for the engine to work. This file exists so the tags are
; browsable in Project Settings > GameplayTags and in DataTable/GameplayEffect
; tag pickers without opening C++. If you add a tag in C++, add the same
; string here (or just rely on the native registration — the picker will
; show it either way, this listing is documentation, not a dependency).
; Keep both in sync when adding new tags — see HellwakeGameplayTags.h.

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
