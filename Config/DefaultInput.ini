; Legacy axis/action mappings are intentionally empty — Hellwake uses
; Enhanced Input exclusively (see project-bible/unreal-implementation.md
; "Enhanced Input mappings" for the full IMC_Hellwake_Default spec:
; IA_Move, IA_LightAttack, IA_HeavyAttack, IA_Dodge, IA_Emberbrand,
; IA_Bulwark, IA_Ruinfall, IA_WakeOfHell, bound to WASD / LMB / RMB /
; Shift+Space / Q / F / E / R respectively, matching
; docs/hellwake-behavioral-spec.md's confirmed control scheme). These
; Input Action / Input Mapping Context assets are binary and must be
; created in-editor; this file only switches the engine over to the
; Enhanced Input player input/component classes.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bAltEnterTogglesFullscreen=True
bEnableGestureRecognizer=False

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableUserSettings=False
bSendTriggeredEventsWhenPaused=False
DefaultMappingContextPriority=0
