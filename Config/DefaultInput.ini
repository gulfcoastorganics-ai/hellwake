; Hellwake prefers Enhanced Input assets when they exist, but also ships a
; config-only fallback so the native C++ vertical slice is immediately
; controllable in a clean UE 5.4 checkout before binary IA_/IMC_ assets are
; authored. AHellwakeCharacter binds these legacy names only when the
; corresponding Enhanced Input asset property is null.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bAltEnterTogglesFullscreen=True
bEnableGestureRecognizer=False

+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)

+ActionMappings=(ActionName="LightAttack",Key=LeftMouseButton)
+ActionMappings=(ActionName="HeavyAttack",Key=RightMouseButton)
+ActionMappings=(ActionName="Dodge",Key=LeftShift)
+ActionMappings=(ActionName="Dodge",Key=SpaceBar)
+ActionMappings=(ActionName="Emberbrand",Key=Q)
+ActionMappings=(ActionName="Bulwark",Key=F)
+ActionMappings=(ActionName="Ruinfall",Key=E)
+ActionMappings=(ActionName="WakeOfHell",Key=R)

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableUserSettings=False
bSendTriggeredEventsWhenPaused=False
DefaultMappingContextPriority=0
